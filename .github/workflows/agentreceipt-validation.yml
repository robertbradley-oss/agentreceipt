name: AgentReceipt validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-action:
    name: Check, test, build, and package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check all packages
        run: pnpm check

      - name: Run all tests
        run: pnpm test

      - name: Build and package the Action
        run: pnpm build

      - name: Verify the packaged entrypoint
        run: node --check packages/github-action/bundle/index.js
